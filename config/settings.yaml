# Blender Configuration
blender:
  executable_path: "D:\\app\\blender.exe"
  timeout_seconds: 120

# Output Directories
paths:
  json_output: "outputs/json-file"
  blender_output: "outputs/blender-files"
  schemas: "data/schemas"

# LLM Defaults
model:
  name: "gemini-3.5-flash-lite"
  temperature: 0.4
